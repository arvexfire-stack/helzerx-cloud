name: Build HelzerX Cloud
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check repair script syntax
        run: bash -n scripts/final-repair.sh
      - name: Install API dependencies
        run: npm install
        working-directory: api
      - name: Test order API
        run: npm test
        working-directory: api
      - name: Install frontend dependencies
        run: npm install
      - name: Build production frontend
        run: npm run build
