name: Build HelzerX Cloud
on:
  push:
    branches: [main, feat/control-plane-foundation]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check backend JavaScript syntax
        working-directory: backend
        run: npm run check
      - name: Run backend schema contract tests
        working-directory: backend
        run: npm test
